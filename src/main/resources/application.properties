spring.application.name=prestige-motors
server.port=8080

# --- Base de datos (MySQL de XAMPP). Cambia usuario/clave si los tuyos son distintos. ---
spring.datasource.url=jdbc:mysql://localhost:3306/prestige_motors?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima
spring.datasource.username=root
spring.datasource.password=

# Hibernate crea/actualiza las tablas a partir de las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
